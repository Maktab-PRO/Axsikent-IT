<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Axsikent IT — Teacher Login</title>
<link rel="stylesheet" href="teacher.css">
</head>
<body>
<div id="teacherLogin" class="auth-screen">
  <div class="auth-glow glow-a"></div><div class="auth-glow glow-b"></div>
  <div class="auth-card">
    <button class="auth-logo" id="teacherLoginLogo" type="button" aria-label="Axsikent IT"><img src="assets/Sayt%20logo1.png" alt="Axsikent IT"></button>
    <div class="auth-kicker">AXSIKENT IT / TEACHER ACCESS</div>
    <h1 data-i18n="loginTitle">O‘qituvchi paneliga kirish</h1>
    <p data-i18n="loginText">Kirish ma’lumotlaringizni kiriting. Yangi o‘qituvchini faqat administrator ro‘yxatdan o‘tkazadi.</p>
    <form id="teacherLoginForm">
      <label><span data-i18n="phone">Telefon raqam</span><input id="teacherPhone" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel" required></label>
      <label class="password-field"><span data-i18n="password">Parol</span><div class="password-wrap"><input id="teacherPassword" type="password" placeholder="Parol" autocomplete="current-password" required><button type="button" class="password-toggle" id="teacherPasswordToggle" aria-label="Parolni ko‘rsatish"><svg class="eye-show" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.7"/></svg><svg class="eye-hide" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none"><path d="m3 3 18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c6.1 0 9.5 6 9.5 6a16.6 16.6 0 0 1-3.2 3.7M6.2 6.3C3.8 8 2.5 12 2.5 12s3.4 6 9.5 6c1.4 0 2.6-.3 3.7-.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></label>
      <button class="premium-btn primary" type="submit"><span>↗</span><span data-i18n="enter">Kirish</span></button>
    </form>
    <div id="teacherLoginMessage" class="auth-message"></div>
    <div class="auth-note"><span>◈</span><span data-i18n="adminOnly">Yangi o‘qituvchi akkaunti administrator tomonidan yaratiladi.</span></div>
    <div class="auth-language"><span>◎</span><div class="language-picker" data-picker="teacher"><button type="button" class="language-trigger" id="teacherLangButton">UZ <span>⌄</span></button><div class="language-menu"><button type="button" data-lang="uz">🇺🇿 UZ</button><button type="button" data-lang="ru">🇷🇺 RU</button><button type="button" data-lang="en">🇬🇧 EN</button></div></div></div>
  </div>
</div>
<script src="teacher-login.js?v=1"></script>
</body></html>
