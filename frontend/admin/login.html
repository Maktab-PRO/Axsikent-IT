<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Axsikent IT — Administrator Login</title>

    <meta
        name="description"
        content="Axsikent IT — Administratorlar boshqaruv markazi"
    >

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="admin-login-page">

        <div class="admin-login-glow glow-one"></div>
        <div class="admin-login-glow glow-two"></div>


        <div class="admin-login-card">

            <div class="login-brand">

                <div class="login-logo">
                    <img src="../assets/Sayt%20logo1.png" alt="Axsikent IT">
                </div>

                <div class="login-brand-info">
                    <small>IT ADMINISTRATORLAR BOSHQARUV MARKAZI</small>
                </div>

            </div>


            <div class="login-heading">

                <span class="eyebrow">
                    XAVFSIZ KIRISH
                </span>

                <h1>
                    Administrator
                    <br>
                    <span>Tizimga kirish</span>
                </h1>

                <p>
                    Administrator boshqaruv paneliga kirish uchun
                    ma'lumotlaringizni kiriting.
                </p>

            </div>


            <form id="adminLoginForm">

                <div class="login-field">

                    <label for="adminPhone">
                        Telefon raqam
                    </label>

                    <div class="login-input-wrap">

                        <span
                            class="input-icon"
                            aria-hidden="true"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                width="20"
                                height="20"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </span>

                        <input
                            type="tel"
                            id="adminPhone"
                            name="phone"
                            placeholder="+998901234567"
                            autocomplete="username"
                            inputmode="tel"
                            required
                        >

                    </div>

                </div>


                <div class="login-field">

                    <label for="adminPassword">
                        Parol
                    </label>

                    <div class="login-input-wrap">

                        <span
                            class="input-icon"
                            aria-hidden="true"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                width="20"
                                height="20"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    x="3"
                                    y="11"
                                    width="18"
                                    height="10"
                                    rx="2"
                                />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Administrator paroli"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Parolni ko‘rsatish"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                width="20"
                                height="20"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />
                            </svg>
                        </button>

                    </div>

                </div>


                <div
                    class="login-error"
                    id="loginError"
                    role="alert"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    class="login-submit"
                    id="loginSubmit"
                >

                    <span class="login-submit-text">
                        Tizimga kirish
                    </span>

                    <span class="login-submit-loader">
                        Tekshirilmoqda...
                    </span>

                    <span class="login-submit-arrow">
                        →
                    </span>

                </button>

            </form>


            <div class="login-security">

                <span
                    class="security-icon"
                    aria-hidden="true"
                >
                    ◆
                </span>

            </div>


            <div class="login-footer">
                Axsikent IT © 2026
            </div>

        </div>

    </div>


    <div
        id="toastContainer"
        class="toast-container"
    ></div>


    <script>

        "use strict";


        const API_BASE =
            "https://axsikent-it-4.onrender.com";

        const TOKEN_KEY =
            "axsikent_admin_token";

        const ADMIN_KEY =
            "axsikent_admin";


        const form =
            document.getElementById(
                "adminLoginForm"
            );

        const phoneInput =
            document.getElementById(
                "adminPhone"
            );

        const passwordInput =
            document.getElementById(
                "adminPassword"
            );

        const passwordToggle =
            document.getElementById(
                "passwordToggle"
            );

        const errorBox =
            document.getElementById(
                "loginError"
            );

        const submitButton =
            document.getElementById(
                "loginSubmit"
            );


        /* =================================================
           OLD SESSIONNI BACKEND ORQALI TEKSHIRISH
        ================================================= */

        async function checkExistingSession() {

            const existingToken =
                localStorage.getItem(
                    TOKEN_KEY
                );

            if (!existingToken) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_BASE}/admins/me`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${existingToken}`
                            }
                        }
                    );


                if (response.ok) {

                    window.location.replace(
                        "index.html"
                    );

                    return;
                }


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.removeItem(
                        TOKEN_KEY
                    );

                    localStorage.removeItem(
                        ADMIN_KEY
                    );

                    return;
                }


                showError(
                    "Sessiyani tekshirishda server xatosi yuz berdi."
                );

            } catch (error) {

                console.error(
                    "Session check error:",
                    error
                );

                showError(
                    "Server bilan bog‘lanib bo‘lmadi. Internet aloqangizni tekshiring."
                );

            }

        }


        /* =================================================
           PASSWORD SHOW / HIDE
        ================================================= */

        passwordToggle.addEventListener(
            "click",
            () => {

                const willShow =
                    passwordInput.type === "password";


                passwordInput.type =
                    willShow
                        ? "text"
                        : "password";


                passwordToggle.innerHTML =
                    willShow
                        ? `
                            <svg
                                viewBox="0 0 24 24"
                                width="20"
                                height="20"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M3 3l18 18"/>
                                <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/>
                                <path d="M9.88 4.24A9.9 9.9 0 0 1 12 4c5 0 8.5 4 10 8a16.4 16.4 0 0 1-3.17 4.73"/>
                                <path d="M6.61 6.61C4.72 7.83 3.35 9.68 2 12c1.5 4 5 8 10 8 1.1 0 2.15-.18 3.12-.51"/>
                            </svg>
                        `
                        : `
                            <svg
                                viewBox="0 0 24 24"
                                width="20"
                                height="20"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />
                            </svg>
                        `;


                passwordToggle.setAttribute(
                    "aria-label",
                    willShow
                        ? "Parolni yashirish"
                        : "Parolni ko‘rsatish"
                );

            }
        );


        /* =================================================
           ERROR
        ================================================= */

        function showError(message) {

            errorBox.textContent =
                message;

            errorBox.classList.add(
                "show"
            );

        }


        function clearError() {

            errorBox.textContent =
                "";

            errorBox.classList.remove(
                "show"
            );

        }


        /* =================================================
           LOGIN
        ================================================= */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                clearError();


                const phone =
                    phoneInput.value
                        .trim()
                        .replace(/[\s()-]/g, "");


                const password =
                    passwordInput.value;


                /* EMPTY CHECK */

                if (!phone || !password) {

                    showError(
                        "Telefon raqam va parolni kiriting."
                    );

                    return;
                }


                /* UZBEKISTAN PHONE CHECK */

                if (
                    !/^(?:\+998|998)\d{9}$/.test(
                        phone
                    )
                ) {
                    showError(
                        "Telefon raqamni +998901234567 yoki 998901234567 ko‘rinishida kiriting."
                    );
                    phoneInput.focus();
                    return;
                }


                /* LOADING */

                submitButton.classList.add(
                    "loading"
                );

                submitButton.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            `${API_BASE}/admins/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    phone,
                                    password
                                })
                            }
                        );


                    let data =
                        null;


                    try {

                        data =
                            await response.json();

                    } catch {

                        data =
                            null;

                    }


                    if (!response.ok) {

                        throw new Error(
                            data?.detail ||
                            "Login amalga oshmadi."
                        );

                    }


                    if (
                        !data?.access_token
                    ) {

                        throw new Error(
                            "Server token qaytarmadi."
                        );

                    }


                    /* SAVE TOKEN */

                    localStorage.setItem(
                        TOKEN_KEY,
                        data.access_token
                    );

                    sessionStorage.setItem(
                        "axsikent_admin_session",
                        "active"
                    );


                    /* SAVE ADMIN */

                    localStorage.setItem(
                        ADMIN_KEY,
                        JSON.stringify({
                            admin_id:
                                data.admin_id,

                            full_name:
                                data.full_name,

                            role:
                                data.role
                        })
                    );


                    /* SUCCESS */

                    submitButton.classList.add(
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.replace(
                                "index.html"
                            );

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Admin login error:",
                        error
                    );


                    showError(
                        error.message ||
                        "Server bilan bog‘lanib bo‘lmadi."
                    );


                    submitButton.classList.remove(
                        "loading"
                    );

                    submitButton.disabled =
                        false;

                }

            }
        );


        /* =================================================
           START SESSION CHECK
        ================================================= */

        checkExistingSession();

    </script>

</body>
</html>
