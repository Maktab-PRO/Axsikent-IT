<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Akhsikent IT — Ota-ona sahifasi</title><link rel="stylesheet" href="parent.css?v=20261002-03"></head><body><main class="auth-shell"><section class="auth-card"><img src="assets/Sayt%20logo3.png?v=20261002-02" alt="Axsikent IT" class="logo"><span class="eyebrow">OTA-ONA SAHIFASI</span><h1>Farzandingiz ta'limini kuzating</h1><p>Farzandingizning davomat, uy vazifasi, baholari va progressini bir joyda ko‘ring.</p><form id="parentLoginForm"><label><span class="field-label"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 3.08 5.18 2 2 0 0 1 5.06 3h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L9 10.73a16 16 0 0 0 4.27 4.27l1.27-1.23a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/></svg>Telefon raqam</span><input id="parentPhone" type="tel" name="username" inputmode="tel" autocomplete="username tel" autocapitalize="off" spellcheck="false" required></label><label><span class="field-label"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Parol</span><div class="password-field"><input id="parentPassword" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" id="parentPasswordToggle" aria-label="Parolni ko‘rsatish" aria-pressed="false"><svg class="ui-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="ui-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.2 18.2 0 0 1-3.2 3.9"/><path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 2.1-.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div></label><button type="submit" class="primary-action"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Kirish</button><div id="parentLoginMessage" role="alert"></div></form><a href="parent-application.html" style="display:block;margin:14px 0 0;text-align:center;color:#86efac;text-decoration:none;font-weight:700;">Ota-ona sifatida ariza qoldirish</a><a href="index.html" class="back-link"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Asosiy sahifaga</a></section></main><script src="parent-login.js?v=20261002-02"></script><script>const passwordInput=document.getElementById("parentPassword");const passwordToggle=document.getElementById("parentPasswordToggle");passwordToggle?.addEventListener("click",()=>{const showing=passwordInput.type==="text";passwordInput.type=showing?"password":"text";passwordToggle.setAttribute("aria-label",showing?"Parolni ko‘rsatish":"Parolni yashirish");passwordToggle.setAttribute("aria-pressed",String(!showing));passwordToggle.classList.toggle("is-visible",!showing);});</script></body></html>
