<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akhsikent IT — Ota-ona arizasi</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07110b;color:#f8fafc;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:#0d1912;border:1px solid #203c2a;border-radius:24px;padding:28px;box-shadow:0 24px 70px #0008}
.logo{font-weight:800;letter-spacing:.2px;color:#4ade80;font-size:22px}.muted{color:#94a3b8;line-height:1.6}.field{margin:18px 0}.field label{display:block;margin-bottom:8px;font-weight:650}.field input,.field textarea{width:100%;border:1px solid #294a35;background:#08120c;color:#fff;border-radius:13px;padding:13px 14px;font:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:#4ade80}.field textarea{min-height:100px;resize:vertical}.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:800;font-size:15px;background:#22c55e;color:#041008;cursor:pointer}.msg{margin-top:14px;line-height:1.5}.back{display:inline-block;margin-top:18px;color:#86efac;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<div class="logo">Akhsikent IT</div>
<h1>Ota-ona arizasi</h1>
<p class="muted">Arizani yuboring. Administrator tekshiradi. Tasdiqlangandan keyin login va vaqtinchalik parol SMS orqali telefoningizga yuboriladi.</p>
<form id="parentApplicationForm">
<div class="field"><label for="fullName">Ota-ona F.I.Sh.</label><input id="fullName" required minlength="2" maxlength="150" autocomplete="name"></div>
<div class="field"><label for="phone">Ota-ona telefoni</label><input id="phone" type="tel" placeholder="+998901234567" required autocomplete="tel"></div>
<div class="field"><label for="studentPhone">O‘quvchi telefoni</label><input id="studentPhone" type="tel" placeholder="+998901234567" required></div>
<div class="field"><label for="comment">Izoh</label><textarea id="comment" maxlength="2000"></textarea></div>
<button class="btn" type="submit">Ariza yuborish</button>
<div id="msg" class="msg" aria-live="polite"></div>
</form>
<a class="back" href="parent-login.html">← Ota-ona kirish sahifasiga</a>
</main>
<script>
const API="https://axsikent-it-backend.onrender.com";
document.getElementById("parentApplicationForm").addEventListener("submit",async e=>{
 e.preventDefault();const msg=document.getElementById("msg");msg.textContent="Yuborilmoqda...";
 try{
  const r=await fetch(API+"/parent-applications/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   full_name:document.getElementById("fullName").value.trim(),
   phone:document.getElementById("phone").value.trim(),
   student_phone:document.getElementById("studentPhone").value.trim(),
   comment:document.getElementById("comment").value.trim()||null
  })});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Ariza yuborilmadi.");
  msg.textContent="Ariza qabul qilindi. Ariza raqami: "+d.application_id+". Tasdiqlangach SMS yuboriladi.";
  e.target.reset();
 }catch(err){msg.textContent=err.message||"Xatolik yuz berdi."}
});
</script>
</body>
</html>
